name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all modules
        run: python -m compileall -q .
      - name: Publication gate regression
        run: python evals/gate_test.py && python evals/evening_test.py
